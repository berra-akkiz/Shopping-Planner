<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Shopping Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="logo"><h2>Shopping Planner</h2></div>
        <ul>
            <li><a href="index.html">Ana Sayfa</a></li>
            <li><a href="contact.html">İletişim</a></li>
        </ul>
        <button id="theme-toggle" class="btn btn-warning">Koyu Tema</button>
    </nav>

    <div class="container center-content">
        <div class="card" style="max-width: 600px; width: 100%;">
            <h1 style="color: var(--primary-color);">Bize Ulaşın</h1>
            <p>Sorularınız ve önerileriniz için formu doldurun.</p>
            
            <form id="contact-form" onsubmit="handleContact(event)">
                <label>Adınız Soyadınız</label>
                <input type="text" id="c-name" placeholder="Adınız..." required>

                <label>E-posta Adresiniz</label>
                <input type="email" id="c-email" placeholder="ornek@mail.com" required>

                <label>Mesajınız</label>
                <textarea id="c-message" rows="5" placeholder="Mesajınızı buraya yazın..." required></textarea>

                <button type="submit" class="btn btn-primary full-width">Gönder</button>
            </form>

            <div id="success-msg" class="alert-box alert-success" style="display:none; margin-top:15px;">
                Mesajınız başarıyla gönderildi!
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Shopping Planner.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
